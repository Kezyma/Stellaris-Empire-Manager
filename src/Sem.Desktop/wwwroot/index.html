<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellaris Empire Manager</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Sem.Ui/sem.css" />
    <style>
        /* The window itself is the chrome here, so the page fills it with nothing of its own. */
        html, body { height: 100%; overflow: hidden; }
        .sem-app { height: 100%; }
        .sem-main { overflow-y: auto; height: calc(100vh - 49px); }
    </style>
</head>

<body>
    <div id="app">
        <div style="padding:60px;text-align:center;color:#8b97a6">Starting…</div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;width:100%;padding:0.7rem 1.25rem;background:#4a1f1f;color:#f0dede;border-top:1px solid #d95c5c;z-index:1000">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" style="cursor:pointer;position:absolute;right:0.75rem;top:0.6rem">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
