<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellaris Empire Manager</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/Sem.Ui/sem.css" />
    <style>
        /*
            The window itself is the chrome here, so the page fills it with nothing of its own.

            .sem-main takes whatever the header and the content bar leave, by the flex:1 it already
            carries, rather than by subtracting their height. It had subtracted 49px, which was the
            header alone and had since become 60, and never counted the 52px content bar at all — so
            the scrolling region ran 63px past the bottom of the window.

            #app has to carry the height too. Blazor's root div sits between body and .sem-app, and a
            percentage height against an auto-height parent is auto — so without this line .sem-app
            grows to its content, body clips it, and nothing scrolls at all. min-height:0 for the
            same family of reason: a flex item will not shrink below its content without it, which is
            what makes .sem-main scroll rather than push.
        */
        html, body { height: 100%; overflow: hidden; }
        #app, .sem-app { height: 100%; }
        .sem-main { overflow-y: auto; min-height: 0; }
    </style>
</head>

<body>
    <div id="app">
        <div style="padding:60px;text-align:center;color:#8b97a6">Starting…</div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;left:0;width:100%;padding:11px 20px;background:#4a1f1f;color:#f0dede;border-top:1px solid #d95c5c;z-index:1000">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" style="cursor:pointer;position:absolute;right:12px;top:10px">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
