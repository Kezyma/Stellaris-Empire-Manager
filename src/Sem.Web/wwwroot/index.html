<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stellaris Empire Manager</title>
    <base href="/" />

    <!--
        There was no policy at all here, which cost nothing while the app held no credentials and
        will cost a great deal the moment it holds a cloud token: any script that reaches this
        origin can read whatever the page can.

        Two directives are doing the real work. connect-src says where bytes may be sent, which is
        what stops a stolen token being posted anywhere; providers get added to it as they arrive,
        and OneDrive is the first - graph.microsoft.com for the file, login.microsoftonline.com for
        the sign-in.

        The two wildcards after those are not by choice. Asking Graph for a file's contents hands
        back a redirect to whichever content host that account lives on - my.microsoftpersonalcontent.com
        for this one - and the name varies per account, so there is nothing exact to name. A policy
        without them refuses the download with the file sitting right there, which is precisely how
        this was found. The app never sends the token to either: the download link carries its own
        short-lived one, and the request is built without an Authorization header on purpose.
        base-uri matters more here than in most apps, because every address in this one is relative
        to the base href above, so an injected <base> would repoint the whole site.

        form-action stays 'none' even though there is now a sign-in. The flow leaves by changing the
        address rather than by submitting a form, which that directive does not govern, and leaving
        it shut means an injected form still has nowhere to post to.

        script-src and style-src both carry 'unsafe-inline', and that is not laziness. The published
        page carries an inline import map whose contents change with every build, so it cannot be
        hashed; and colours are set through inline style attributes in about thirty places, which a
        strict style-src would blank. What 'self' still buys is the common case: an injected
        <script src="https://elsewhere"> is refused.

        wasm-unsafe-eval is required - Blazor WebAssembly cannot start without it.

        frame-ancestors is deliberately absent: a <meta> policy may not set it, so clickjacking has
        to be answered by a header this host cannot send.
    -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self';
        connect-src 'self' https://graph.microsoft.com https://login.microsoftonline.com
            https://*.microsoftpersonalcontent.com https://*.files.1drv.com;
        object-src 'none';
        base-uri 'self';
        form-action 'none'
    " />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/Sem.Ui/sem.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0d1117" />

    <!-- Sem.Web.styles.css is deliberately absent. It is the template's link to the scoped-styles
         bundle, which the build only produces where a .razor.css exists - and none does, every rule
         living in sem.css so the web and the desktop shell wear the same one. Left in, it was a 404
         on every load of the deployed site. Adding a scoped stylesheet means adding the line back. -->
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Something went wrong.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
