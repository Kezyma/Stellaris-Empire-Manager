name: CI

on:
  pull_request:
    branches: [main]

  # Called by the Main workflow, so nothing is deployed until this has passed.
  #
  # No push trigger. This used to have one as well, and with two workflows each calling it as their
  # own gate that meant the same build and the same tests three times per push to main - about seven
  # and a half minutes of a thirteen-minute total. A push to main runs this once, through Main; a
  # pull request, which has no deployment behind it, runs it here.
  workflow_call:

jobs:
  build:
    # Windows because the desktop shell targets net10.0-windows and WPF cannot build elsewhere.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Tests tagged Category=RealData need a Stellaris installation and skip automatically here.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
