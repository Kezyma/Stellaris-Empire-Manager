# Everything a push to main does: check it, publish the site, and put up the desktop build.
#
# One workflow because there was one check being run three times. ci.yml triggered on the push, and
# the site and the release each called it again as their own gate - so every push spent about
# thirteen minutes of runner time, seven and a half of it the same build and the same tests over
# again. Here the gate runs once and both deployments hang off it, in parallel.
#
# The cost is that the two deployments share a run: a failed release is reported beside the site
# publish rather than apart from it. That is the trade, and it is worth it at five minutes a push.
#
# ci.yml still runs on its own for a pull request, which is the case with no deployment behind it.
# It no longer triggers on a push to main, because this is that.

name: Main

on:
  push:
    branches: [main]

  # Republishes the site and rebuilds the release without a commit - after changing a Pages setting,
  # say. Both, because each is a replacement of something that already exists and neither costs
  # anything to redo.
  workflow_dispatch:

jobs:
  # Nothing is deployed from a commit whose tests did not pass, and "it compiled" is not that check:
  # both jobs below would build happily over a failing test.
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check

    # Scoped to the job now that two of them share a workflow, rather than granted to both.
    permissions:
      contents: read
      pages: write
      id-token: write

    # Never two at once, and a newer publish wins rather than queueing behind an older one.
    concurrency:
      group: pages
      cancel-in-progress: true

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The base path has to match where the site is served from, or every asset resolves against
      # the domain root and the page comes up blank. The project defaults to the repository's name;
      # a custom domain would want "/" passed here instead.
      - name: Publish
        run: dotnet publish src/Sem.Web --configuration Release --output artifacts/pages

      # Without this GitHub Pages runs the output through Jekyll, which drops every folder whose
      # name begins with an underscore — _framework among them, which is the whole application.
      - name: Check the site will not be run through Jekyll
        run: test -f artifacts/pages/wwwroot/.nojekyll || { echo "::error::No .nojekyll in the published site; Pages would drop _framework."; exit 1; }

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: check

    # Creating and deleting the release, and moving its tag.
    permissions:
      contents: write

    # Never two at once, and never cancelled to make room for the next. Cancelling looked right -
    # for a rolling release the newer build is the one anybody wants - and it cost us the release:
    # a run cancelled partway through replacing it left the repository with no download at all. The
    # step below no longer has that window, and this no longer opens one.
    concurrency:
      group: release
      cancel-in-progress: false


    # WPF, so this cannot be built anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Self-contained, so there is nothing to install first: somebody who wants to build empires
      # should not have to read about .NET runtimes to do it. Not single-file, because WPF and the
      # embedded browser both ship native assets that a single file cannot carry, and not trimmed,
      # which WPF does not support at all.
      - name: Publish
        run: >
          dotnet publish src/Sem.Desktop
          --configuration Release
          --runtime win-x64
          --self-contained
          --output artifacts/desktop

      # Eighty-five megabytes of native debugging symbols for the drawing library, which nobody
      # downloading this will ever open, and the documentation files that exist for writing code
      # against these assemblies rather than running them. Together a third of the download.
      #
      # Our own symbols stay - about a megabyte, and they are what turns a crash report into a line
      # number.
      - name: Leave out what nobody downloading it needs
        shell: pwsh
        run: |
          $symbols = 'artifacts/desktop/libSkiaSharp.pdb'

          if (Test-Path $symbols) { Remove-Item $symbols }

          Get-ChildItem artifacts/desktop -Filter *.xml -Recurse | Remove-Item

      - name: Zip it
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/desktop/* `
            -DestinationPath artifacts/StellarisEmpireManager-win-x64.zip `
            -Force

      # The prose lives in .github/release-notes.md, with two placeholders filled in here. Kept
      # out of this file because a here-string inside a YAML block is two sets of quoting rules
      # arguing over the same backticks, and because the words are worth editing without reading
      # any of this.
      - name: Write the notes
        shell: pwsh
        run: |
          $notes = Get-Content .github/release-notes.md -Raw
          $notes = $notes.Replace('{sha}', $env:GITHUB_SHA.Substring(0, 7))
          $notes = $notes.Replace('{date}', (Get-Date -Format 'd MMMM yyyy'))

          Set-Content release-notes.md -Value $notes -Encoding utf8

      # Nothing is taken down to put something up.
      #
      # The tag moves first, and a release is bound to its tag's name - so the release that already
      # exists follows the tag to this commit without being touched. Then the asset is replaced in
      # place and the notes rewritten. What this replaces deleted the release and made a new one,
      # which is two steps with no release in between, and a run cancelled in that gap left the
      # repository with nothing to download.
      #
      # One window is left and cannot be closed from here: --clobber takes the old file down before
      # it puts the new one up, so the download address answers 404 for the seconds that upload
      # takes. Left rather than worked around - assets cannot be renamed, so the alternative is
      # uploading twice - and nothing can interrupt it now, which is the difference that mattered.
      #
      # It must not be flagged a pre-release. /releases/latest skips pre-releases entirely, so the
      # download address at the top of this file would answer 404 against a release plainly visible
      # on the page.
      - name: Put up the rolling release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Asking whether a release exists is a question whose answer is often "no", and Actions
          # runs this with the error preference set to stop - which PowerShell 7.4 extended to
          # native commands exiting non-zero. Every command below is checked on its own instead.
          $PSNativeCommandUseErrorActionPreference = $false

          git tag --force latest
          git push --force origin latest

          if ($LASTEXITCODE -ne 0) { throw 'The tag could not be moved.' }

          $zip = 'artifacts/StellarisEmpireManager-win-x64.zip'

          gh release view latest --json tagName | Out-Null

          if ($LASTEXITCODE -eq 0) {
            gh release upload latest $zip --clobber

            if ($LASTEXITCODE -ne 0) { throw 'The build could not be attached to the release.' }

            gh release edit latest --title 'Latest build' --notes-file release-notes.md --latest

            if ($LASTEXITCODE -ne 0) { throw 'The release could not be brought up to date.' }
          }
          else {
            gh release create latest $zip `
              --target $env:GITHUB_SHA `
              --title 'Latest build' `
              --notes-file release-notes.md `
              --latest

            if ($LASTEXITCODE -ne 0) { throw 'The release could not be created.' }
          }
